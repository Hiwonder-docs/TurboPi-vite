<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>TurboPi Documentation</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f5f7fb; }
    .container { text-align: center; }
    h1 { color: #1f2937; margin-bottom: 28px; }
    .versions { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .version-card { display: block; width: 240px; padding: 28px 20px; background: #fff; border-radius: 10px; text-decoration: none; color: #1f2937; box-shadow: 0 2px 10px rgba(15,23,42,0.08); transition: transform 0.2s, box-shadow 0.2s; }
    .version-card:hover { transform: translateY(-4px); box-shadow: 0 8px 20px rgba(15,23,42,0.14); }
    .version-card h2 { margin: 0 0 8px; font-size: 20px; }
    .version-card p { margin: 0; color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>TurboPi Documentation</h1>
    <div class="versions">
      <a class="version-card" href="/projects/TurboPi/en/standard/">
        <h2>Standard</h2>
        <p>TurboPi standard documentation</p>
      </a>
      <a class="version-card" href="/projects/TurboPi/en/advanced/">
        <h2>Advanced</h2>
        <p>TurboPi advanced documentation</p>
      </a>
    </div>
  </div>
</body>
</html>
